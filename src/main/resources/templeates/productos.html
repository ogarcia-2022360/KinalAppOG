<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="../css/styleCrud.css">
</head>
<body>
    <main class="crud-container">
        <img src="../img/producto.png" alt="Producto" class="crud-image">

        <h1>Gestión de Productos</h1>

        <form id="productoForm" class="crud-form">
            <input type="hidden" id="codigoProducto">

            <label>Nombre:</label>
            <input type="text" id="nombreProducto" required>

            <label>Precio:</label>
            <input type="number" step="0.01" id="precioProducto" required>

            <label>Stock:</label>
            <input type="number" id="stockProducto" required>

            <label>Estado:</label>
            <input type="number" id="estadoProducto">

            <button type="submit" class="btn-crud">Guardar</button>
        </form>

        <table class="crud-table">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="productosTable"></tbody>
        </table>

        <a href="entidades.html" class="menu-link">Volver al menú</a>
    </main>

    <script>
        async function cargarProductos() {
            const res = await fetch("/productos");
            const data = await res.json();
            const tbody = document.getElementById("productosTable");
            tbody.innerHTML = "";
            data.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.codigoProducto}</td>
                        <td>${p.nombreProducto}</td>
                        <td>${p.precioProducto}</td>
                        <td>${p.stockProducto}</td>
                        <td>${p.estadoProducto}</td>
                        <td>
                            <button onclick="editarProducto(${p.codigoProducto})">Editar</button>
                            <button onclick="eliminarProducto(${p.codigoProducto})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById("productoForm").addEventListener("submit", async e => {
            e.preventDefault();
            const producto = {
                codigoProducto: document.getElementById("codigoProducto").value,
                nombreProducto: document.getElementById("nombreProducto").value,
                precioProducto: document.getElementById("precioProducto").value,
                stockProducto: document.getElementById("stockProducto").value,
                estadoProducto: document.getElementById("estadoProducto").value
            };
            const method = producto.codigoProducto ? "PUT" : "POST";
            const url = producto.codigoProducto ? `/productos/${producto.codigoProducto}` : "/productos";
            await fetch(url, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(producto)
            });
            cargarProductos();
        });

        async function eliminarProducto(id) {
            await fetch(`/productos/${id}`, { method: "DELETE" });
            cargarProductos();
        }

        async function editarProducto(id) {
            const res = await fetch(`/productos/${id}`);
            const p = await res.json();
            document.getElementById("codigoProducto").value = p.codigoProducto;
            document.getElementById("nombreProducto").value = p.nombreProducto;
            document.getElementById("precioProducto").value = p.precioProducto;
            document.getElementById("stockProducto").value = p.stockProducto;
            document.getElementById("estadoProducto").value = p.estadoProducto;
        }

        cargarProductos();
    </script>
</body>
</html>
